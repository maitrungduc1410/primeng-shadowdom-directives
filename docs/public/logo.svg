<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <title>primeng-shadowdom-directives</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8" />
      <stop offset="1" stop-color="#6366F1" />
    </linearGradient>
  </defs>
  <!-- outer host -->
  <rect x="8" y="10" width="48" height="44" rx="8" stroke="url(#g)" stroke-width="3" fill="none" />
  <!-- inner shadow root -->
  <rect x="16" y="18" width="32" height="28" rx="5" fill="url(#g)" opacity="0.22" />
  <rect x="16" y="18" width="32" height="28" rx="5" stroke="url(#g)" stroke-width="2" fill="none" />
  <!-- overlay popup escaping to document -->
  <rect x="34" y="6" width="22" height="16" rx="3" fill="url(#g)" />
  <path d="M40 22 L44 28 L48 22" fill="url(#g)" />
</svg>
